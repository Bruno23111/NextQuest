server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8080;

    location = /api/v1/profile/images {
        # Match the API limit for two 8 MiB images and multipart overhead.
        client_max_body_size 17m;
        proxy_pass http://$api_backend;
    }

    location ~ ^/api/v1/admin/(catalog/batch/preview|deals/popular/import)$ {
        proxy_read_timeout 240s;
        proxy_pass http://$api_backend;
    }

    location /api/ {
        proxy_pass http://$api_backend;
    }

    location = /api/v1/playstation/sync/oauth/callback {
        access_log off;
        proxy_pass http://$api_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
