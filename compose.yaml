name: nextquest

services:
  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:4201:80"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.development.local
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Backlog: Host=postgres;Port=5432;Database=gamesbacklog;Username=gamesbacklog;Password=local-dev-only
      Auth__PublicOrigin: http://127.0.0.1:5080
      Steam__WebReturnUrl: http://localhost:4201/auth/steam/callback
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: conta@gamesbacklog.local
      Smtp__EnableSsl: "false"
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - dotnet GamesBacklog.Api.dll --migrate && exec dotnet GamesBacklog.Api.dll
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:5080:8080"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gamesbacklog
      POSTGRES_USER: gamesbacklog
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamesbacklog -d gamesbacklog"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
